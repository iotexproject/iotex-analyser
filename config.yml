  #http api support
  grpcProxyPort: 7778
  #loaded default plugin list
  plugins:
    - block.so
    - blockaction.so
    - blockmeta.so
    - blockmeta_reward.so
    - delegates.so
    - iotexprice_worker.so
    - action_execution.so
    - block_receipt.so
