version: "3.9"
   
services:
  db:
    image: postgres:12-alpine
    environment:
      - POSTGRES_DB=iotexmainnet
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  analyser:
    image: iotex/iotex-analyser
    command: server
    environment:
      - IOTEX_CHAIN_END_POINT=api.iotex.one:80
      - DB_HOST=db
      - DB_NAME=iotexmainnet
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db